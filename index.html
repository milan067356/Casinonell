<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 NellCasino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --card-border: #232a36;
      --accent-color: #0088cc;
      --accent-gold: #ffb703;
      --text-main: #ffffff;
      --text-muted: #8b96a5;
      --btn-green: #00c853;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 75px;
      overflow-x: hidden;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: rgba(21, 26, 35, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-pill {
      background: rgba(255, 183, 3, 0.12);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page {
      display: none;
      padding: 16px;
    }

    .page.active {
      display: block;
    }

    /* NFT MARKET GRID (3 Columns, No Text Labels) */
    .market-title {
      text-align: center;
      margin-bottom: 16px;
    }

    .market-title h2 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .market-title p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .nft-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .nft-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      aspect-ratio: 1 / 1.15;
      transition: transform 0.15s ease;
      cursor: pointer;
    }

    .nft-card:active {
      transform: scale(0.96);
    }

    .nft-img-container {
      width: 100%;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .nft-img-container img {
      width: 75%;
      height: 75%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    /* Price Tag Pill Style */
    .price-pill {
      width: 100%;
      background: #1e2532;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 6px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 700;
      font-size: 13px;
      color: var(--accent-gold);
    }

    /* GAMES VERTICAL LIST */
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-info h3 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .game-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-play {
      background: var(--btn-green);
      color: #000;
      font-weight: 800;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* PROFILE */
    .promo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #0f131a;
      color: #fff;
      margin: 10px 0;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: var(--accent-color);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    /* NAVIGATION BAR */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(21, 26, 35, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent-color);
    }

    .nav-icon {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="brand-title">👑 NellCasino</div>
    <div class="balance-pill">
      <span>⭐</span> <span id="user-balance">0</span>
    </div>
  </div>

  <!-- PAGE 1: GAMES -->
  <div id="page-games" class="page active">
    <div class="games-list">
      <div class="game-card">
        <div class="game-info">
          <h3>🎰 Slots</h3>
          <p>Классический слот с умножителями</p>
        </div>
        <button class="btn-play" onclick="playGame('Slots')">Играть</button>
      </div>

      <div class="game-card">
        <div class="game-info">
          <h3>⚪ Plinko</h3>
          <p>Падающие шарики и супер-бонусы</p>
        </div>
        <button class="btn-play" onclick="playGame('Plinko')">Играть</button>
      </div>

      <div class="game-card">
        <div class="game-info">
          <h3>🚀 Crash</h3>
          <p>Успей забрать иксы до взрыва</p>
        </div>
        <button class="btn-play" onclick="playGame('Crash')">Играть</button>
      </div>
    </div>
  </div>

  <!-- PAGE 2: NFT MARKET -->
  <div id="page-nft" class="page">
    <div class="market-title">
      <h2>🖼️ Рынок NFT Подарков</h2>
      <p>Официальные 3D подарки Telegram Stars ⭐</p>
    </div>
    <div class="nft-grid" id="nft-container"></div>
  </div>

  <!-- PAGE 3: PROFILE -->
  <div id="page-profile" class="page">
    <div class="promo-card">
      <h3>💳 Пополнение звезд ⭐</h3>
      <input type="number" id="depositInput" class="input-box" value="100">
      <button class="btn-action" onclick="makeDeposit()">Выставить чек</button>
    </div>

    <div class="promo-card">
      <h3>🎁 Вывод звезд</h3>
      <input type="number" id="withdrawInput" class="input-box" value="100">
      <button class="btn-action" style="background:#ff9800;" onclick="makeWithdraw()">Вывести звезды</button>
    </div>

    <div class="promo-card">
      <h3>👥 Реферальная система</h3>
      <input type="text" class="input-box" value="https://t.me/NellCasinobot" readonly>
      <button class="btn-action" style="background:rgba(255,255,255,0.1);" onclick="copyLink()">Скопировать ссылку</button>
    </div>
  </div>

  <!-- BOTTOM NAV BAR -->
  <div class="nav-bar">
    <button class="nav-btn active" id="btn-games" onclick="showPage('games')">
      <span class="nav-icon">🎮</span>
      <span>Игры</span>
    </button>
    <button class="nav-btn" id="btn-nft" onclick="showPage('nft')">
      <span class="nav-icon">🖼️</span>
      <span>Рынок NFT</span>
    </button>
    <button class="nav-btn" id="btn-profile" onclick="showPage('profile')">
      <span class="nav-icon">👤</span>
      <span>Профиль</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let balance = 0;

    const nftCatalog = [
      { price: 398, img: 'https://cdn4.iconfinder.com/data/icons/cute-animals-3d/512/Rabbit_3D.png' },
      { price: 400, img: 'https://cdn3.iconfinder.com/data/icons/3d-party-icons/512/Gift_Box.png' },
      { price: 400, img: 'https://cdn4.iconfinder.com/data/icons/food-and-drink-3d/512/Banana_3D.png' },
      { price: 400, img: 'https://cdn3.iconfinder.com/data/icons/3d-objects-elements/512/Fire_Torch_3D.png' },
      { price: 400, img: 'https://cdn3.iconfinder.com/data/icons/3d-objects-elements/512/Crystal_Ball_3D.png' },
      { price: 400, img: 'https://cdn3.iconfinder.com/data/icons/halloween-3d-elements/512/Pumpkin_3D.png' },
      { price: 401, img: 'https://cdn3.iconfinder.com/data/icons/3d-objects-elements/512/Clock_Time_3D.png' },
      { price: 403, img: 'https://cdn3.iconfinder.com/data/icons/3d-objects-elements/512/Star_Magic_3D.png' },
      { price: 403, img: 'https://cdn3.iconfinder.com/data/icons/halloween-3d-elements/512/Spider_Web_3D.png' },
      { price: 405, img: 'https://cdn4.iconfinder.com/data/icons/cute-animals-3d/512/Snake_3D.png' },
      { price: 410, img: 'https://cdn4.iconfinder.com/data/icons/cute-animals-3d/512/Flamingo_3D.png' },
      { price: 415, img: 'https://cdn3.iconfinder.com/data/icons/3d-objects-elements/512/Magic_Hat_3D.png' }
    ];

    function renderNFTs() {
      const container = document.getElementById('nft-container');
      container.innerHTML = '';

      nftCatalog.forEach(item => {
        const card = document.createElement('div');
        card.className = 'nft-card';
        card.onclick = () => buyNFT(item.price);

        card.innerHTML = `
          <div class="nft-img-container">
            <img src="${item.img}" alt="NFT" onerror="this.src='https://cdn3.iconfinder.com/data/icons/3d-party-icons/512/Gift_Box.png';">
          </div>
          <div class="price-pill">
            <span>${item.price.toLocaleString()}</span> ⭐
          </div>
        `;
        container.appendChild(card);
      });
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(`page-${pageId}`).classList.add('active');
      document.getElementById(`btn-${pageId}`).classList.add('active');
    }

    function playGame(gameName) {
      if (tg) tg.showAlert(`Запуск игры: ${gameName}`);
    }

    function buyNFT(price) {
      if (balance >= price) {
        balance -= price;
        document.getElementById('user-balance').innerText = balance;
        if (tg) tg.showAlert('Поздравляем с покупкой NFT!');
      } else {
        if (tg) tg.showAlert(`Недостаточно звезд. Пополните баланс на ${price - balance} ⭐`);
      }
    }

    function makeDeposit() {
      const val = document.getElementById('depositInput').value;
      if (tg) tg.showAlert(`Чек на ${val} ⭐ отправлен в чат с ботом.`);
    }

    function makeWithdraw() {
      if (tg) tg.showAlert('Для вывода оставьте заявку админу @Navi4563');
    }

    function copyLink() {
      navigator.clipboard.writeText('https://t.me/NellCasinobot');
      if (tg) tg.showAlert('Ссылка скопирована!');
    }

    renderNFTs();
  </script>
</body>
</html>
