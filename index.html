<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NellCasino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #1e1e1e;
      border-radius: 14px;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .brand {
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ffd700;
    }
    .balance-box {
      background: #2a2a2a;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      color: #ffcc00;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* DEPOSIT */
    .deposit-card {
      width: 100%;
      max-width: 400px;
      background: #222;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .deposit-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      outline: none;
    }
    .btn-deposit {
      background: #ff9800;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-tabs {
      width: 100%;
      max-width: 400px;
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #222;
      border: none;
      border-radius: 10px;
      color: #888;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #ff9800;
      color: #000;
    }
    .game-card {
      width: 100%;
      max-width: 400px;
      background: #1e1e1e;
      border-radius: 16px;
      padding: 16px;
      display: none;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .game-card.active {
      display: flex;
    }
    .bet-control {
      width: 100%;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bet-control label {
      font-size: 13px;
      color: #aaa;
    }
    .bet-input {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      outline: none;
    }
    .btn-action {
      width: 100%;
      padding: 14px;
      background: #2e7d32;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(46,125,50,0.4);
      transition: background 0.2s;
    }
    .btn-action:disabled {
      background: #555 !important;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* SLOTS */
    .slots-container {
      display: flex;
      gap: 10px;
      background: #000;
      padding: 15px;
      border-radius: 12px;
      border: 3px solid #ffcc00;
      margin: 15px 0;
    }
    .slot-reel {
      width: 70px;
      height: 90px;
      background: #222;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      overflow: hidden;
      border: 1px solid #444;
    }

    canvas {
      background: #111;
      border-radius: 12px;
      border: 1px solid #333;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">🎰 NellCasino</div>
    <div class="balance-box"><span id="balance">0</span> ⭐</div>
  </div>

  <!-- ПОПОЛНЕНИЕ БАЛАНСА -->
  <div class="deposit-card">
    <input type="number" id="deposit-amount" class="deposit-input" value="100" min="10" placeholder="Кол-во звезд">
    <button class="btn-deposit" onclick="requestDeposit()">💳 Выставить чек</button>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('slots')">Слоты 777</button>
    <button class="tab-btn" onclick="switchTab('plinko')">Плинко</button>
    <button class="tab-btn" onclick="switchTab('crash')">Краш</button>
  </div>

  <!-- СЛОТЫ 777 -->
  <div id="tab-slots" class="game-card active">
    <h3>Классические Слоты</h3>
    <div class="slots-container">
      <div class="slot-reel" id="reel1">7️⃣</div>
      <div class="slot-reel" id="reel2">7️⃣</div>
      <div class="slot-reel" id="reel3">7️⃣</div>
    </div>
    <div class="bet-control">
      <label>Размер ставки (мин. 25 ⭐):</label>
      <input type="number" id="slots-bet" class="bet-input" value="25" min="25">
    </div>
    <button id="slots-btn" class="btn-action" onclick="spinSlots()">Крутить слоты</button>
  </div>

  <!-- ПЛИНКО -->
  <div id="tab-plinko" class="game-card">
    <h3>Плинко</h3>
    <canvas id="plinkoCanvas" width="320" height="320"></canvas>
    <div class="bet-control">
      <label>Размер ставки (мин. 25 ⭐):</label>
      <input type="number" id="plinko-bet" class="bet-input" value="25" min="25">
    </div>
    <button id="plinko-btn" class="btn-action" onclick="dropPlinkoBall()">Бросить шар</button>
  </div>

  <!-- КРАШ -->
  <div id="tab-crash" class="game-card">
    <h3>Краш Ракета</h3>
    <canvas id="crashCanvas" width="320" height="220"></canvas>
    <div class="bet-control">
      <label>Размер ставки (мин. 25 ⭐):</label>
      <input type="number" id="crash-bet" class="bet-input" value="25" min="25">
    </div>
    <button id="crash-btn" class="btn-action" onclick="handleCrashAction()">Сделать ставку</button>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let balance = 0;

    function updateBalance(amount) {
      balance += amount;
      document.getElementById('balance').innerText = balance;
    }

    function requestDeposit() {
      const amt = parseInt(document.getElementById('deposit-amount').value);
      if (isNaN(amt) || amt < 10) {
        alert("Минимальное пополнение — 10 ⭐!");
        return;
      }
      if (tg) {
        tg.sendData(JSON.stringify({ action: "deposit", amount: amt }));
        tg.close();
      } else {
        alert("Запустите WebApp через Telegram, чтобы выставить чек!");
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
      
      if(tab === 'slots') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-slots').classList.add('active');
      } else if(tab === 'plinko') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-plinko').classList.add('active');
        drawPlinkoBoard();
      } else if(tab === 'crash') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('tab-crash').classList.add('active');
        drawCrashInitial();
      }
    }

    function getBet(inputId) {
      const val = parseInt(document.getElementById(inputId).value);
      if (isNaN(val) || val < 25) {
        alert("Минимальная ставка — 25 ⭐!");
        return null;
      }
      if (val > balance) {
        alert("Недостаточно звезд на балансе! Нажмите 'Выставить чек'.");
        return null;
      }
      return val;
    }

    /* --- SLOTS --- */
    const slotSymbols = ['7️⃣', '🍇', '🍋', '🔔', '💎', '🍒', '⭐'];
    function spinSlots() {
      const bet = getBet('slots-bet');
      if (!bet) return;

      updateBalance(-bet);
      const btn = document.getElementById('slots-btn');
      btn.disabled = true;

      let interval = setInterval(() => {
        document.getElementById('reel1').innerText = slotSymbols[Math.floor(Math.random()*slotSymbols.length)];
        document.getElementById('reel2').innerText = slotSymbols[Math.floor(Math.random()*slotSymbols.length)];
        document.getElementById('reel3').innerText = slotSymbols[Math.floor(Math.random()*slotSymbols.length)];
      }, 80);

      setTimeout(() => {
        clearInterval(interval);
        
        let res1, res2, res3;
        if (Math.random() < 0.15) {
          res1 = res2 = slotSymbols[Math.floor(Math.random()*slotSymbols.length)];
          res3 = slotSymbols[Math.floor(Math.random()*slotSymbols.length)];
        } else {
          res1 = slotSymbols[Math.floor(Math.random()*slotSymbols.length)];
          res2 = slotSymbols[Math.floor(Math.random()*slotSymbols.length)];
          res3 = slotSymbols[Math.floor(Math.random()*slotSymbols.length)];
        }

        document.getElementById('reel1').innerText = res1;
        document.getElementById('reel2').innerText = res2;
        document.getElementById('reel3').innerText = res3;

        if (res1 === res2 && res2 === res3) {
          const win = bet * 5;
          updateBalance(win);
          alert(`🎉 ДЖЕКПОТ! Вы выиграли ${win} ⭐!`);
        } else if (res1 === res2 || res2 === res3 || res1 === res3) {
          const win = Math.floor(bet * 1.2);
          updateBalance(win);
          alert(`Совпало 2 символа: +${win} ⭐`);
        }
        btn.disabled = false;
      }, 1500);
    }

    /* --- PLINKO (МАКС 2.0x) --- */
    const pCanvas = document.getElementById('plinkoCanvas');
    const pCtx = pCanvas.getContext('2d');
    const rows = 7;
    const pins = [];
    // Коефіцієнти: максимальний 2.0x
    const multipliers = [2.0, 1.2, 0.5, 0.2, 0.5, 1.2, 2.0];

    function initPlinko() {
      pins.length = 0;
      for (let r = 0; r < rows; r++) {
        const count = r + 3;
        const spacing = 260 / (rows + 2);
        const startX = (320 - (count - 1) * spacing) / 2;
        const y = 40 + r * 32;
        for (let c = 0; c < count; c++) {
          pins.push({ x: startX + c * spacing, y: y });
        }
      }
    }
    initPlinko();

    function drawPlinkoBoard() {
      pCtx.clearRect(0, 0, 320, 320);
      pCtx.fillStyle = "#ffffff";
      pins.forEach(pin => {
        pCtx.beginPath();
        pCtx.arc(pin.x, pin.y, 4, 0, Math.PI * 2);
        pCtx.fill();
      });

      const bucketWidth = 320 / multipliers.length;
      multipliers.forEach((m, i) => {
        pCtx.fillStyle = m >= 1.5 ? "#2e7d32" : (m >= 1.0 ? "#f57c00" : "#c62828");
        pCtx.fillRect(i * bucketWidth + 2, 280, bucketWidth - 4, 30);
        pCtx.fillStyle = "#fff";
        pCtx.font = "bold 11px sans-serif";
        pCtx.textAlign = "center";
        pCtx.fillText(m + "x", i * bucketWidth + bucketWidth / 2, 300);
      });
    }

    function dropPlinkoBall() {
      const bet = getBet('plinko-bet');
      if (!bet) return;

      updateBalance(-bet);
      const btn = document.getElementById('plinko-btn');
      btn.disabled = true;

      let ballX = 160 + (Math.random() * 4 - 2);
      let ballY = 15;
      let vx = 0;
      let vy = 2;

      let anim = setInterval(() => {
        vy += 0.2;
        ballX += vx;
        ballY += vy;

        pins.forEach(pin => {
          let dx = ballX - pin.x;
          let dy = ballY - pin.y;
          let dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 9) {
            vy = -vy * 0.4;
            let pullToCenter = (160 - ballX) * 0.05;
            vx = (dx > 0 ? 0.8 : -0.8) + pullToCenter;
          }
        });

        if (ballX < 10) ballX = 10;
        if (ballX > 310) ballX = 310;

        drawPlinkoBoard();

        pCtx.fillStyle = "#ffeb3b";
        pCtx.beginPath();
        pCtx.arc(ballX, ballY, 7, 0, Math.PI * 2);
        pCtx.fill();

        if (ballY >= 275) {
          clearInterval(anim);
          const bucketWidth = 320 / multipliers.length;
          let idx = Math.floor(ballX / bucketWidth);
          idx = Math.max(0, Math.min(multipliers.length - 1, idx));
          
          const mult = multipliers[idx];
          const win = Math.floor(bet * mult);
          updateBalance(win);
          btn.disabled = false;
        }
      }, 20);
    }

    /* --- CRASH --- */
    const cCanvas = document.getElementById('crashCanvas');
    const cCtx = cCanvas.getContext('2d');
    let crashState = 'idle';
    let currentMultiplier = 1.00;
    let crashPoint = 0;
    let crashAnim = null;
    let currentBet = 0;

    function drawCrashInitial() {
      cCtx.clearRect(0, 0, 320, 220);
      cCtx.strokeStyle = "#333";
      cCtx.lineWidth = 2;
      cCtx.beginPath();
      cCtx.moveTo(30, 190);
      cCtx.lineTo(290, 190);
      cCtx.moveTo(30, 190);
      cCtx.lineTo(30, 20);
      cCtx.stroke();

      cCtx.fillStyle = "#4caf50";
      cCtx.font = "bold 28px sans-serif";
      cCtx.textAlign = "center";
      cCtx.fillText("1.00x", 160, 110);
    }

    function handleCrashAction() {
      const btn = document.getElementById('crash-btn');

      if (crashState === 'idle') {
        const bet = getBet('crash-bet');
        if (!bet) return;
        currentBet = bet;
        updateBalance(-bet);

        crashState = 'running';
        currentMultiplier = 1.00;

        const rand = Math.random();
        if (rand < 0.70) {
          crashPoint = (1.01 + Math.random() * 0.19).toFixed(2);
        } else if (rand < 0.90) {
          crashPoint = (1.21 + Math.random() * 0.50).toFixed(2);
        } else {
          crashPoint = (1.71 + Math.random() * 1.50).toFixed(2);
        }

        btn.innerText = "Забрать выигрыш";
        btn.style.background = "#f57c00";

        let startTime = Date.now();

        crashAnim = setInterval(() => {
          let elapsed = (Date.now() - startTime) / 1000;
          currentMultiplier = (1.00 + elapsed * 0.3).toFixed(2);

          cCtx.clearRect(0, 0, 320, 220);
          
          cCtx.strokeStyle = "#333";
          cCtx.beginPath();
          cCtx.moveTo(30, 190);
          cCtx.lineTo(290, 190);
          cCtx.stroke();

          let rx = 30 + Math.min(230, elapsed * 40);
          let ry = 190 - Math.min(150, (currentMultiplier - 1) * 50);

          cCtx.strokeStyle = "#4caf50";
          cCtx.lineWidth = 3;
          cCtx.beginPath();
          cCtx.moveTo(30, 190);
          cCtx.quadraticCurveTo(30 + (rx - 30) / 2, 190, rx, ry);
          cCtx.stroke();

          cCtx.font = "20px sans-serif";
          cCtx.fillText("🚀", rx - 10, ry + 5);

          cCtx.fillStyle = "#fff";
          cCtx.font = "bold 26px sans-serif";
          cCtx.textAlign = "center";
          cCtx.fillText(currentMultiplier + "x", 160, 60);

          if (parseFloat(currentMultiplier) >= parseFloat(crashPoint)) {
            clearInterval(crashAnim);
            crashState = 'idle';
            cCtx.fillStyle = "#f44336";
            cCtx.font = "bold 28px sans-serif";
            cCtx.fillText("💥 ВЗРЫВ!", 160, 110);
            
            btn.innerText = "Сделать ставку";
            btn.style.background = "#2e7d32";
          }
        }, 50);

      } else if (crashState === 'running') {
        clearInterval(crashAnim);
        crashState = 'idle';
        const win = Math.floor(currentBet * currentMultiplier);
        updateBalance(win);

        cCtx.fillStyle = "#ffeb3b";
        cCtx.font = "bold 22px sans-serif";
        cCtx.fillText(`Забрано: +${win} ⭐!`, 160, 110);

        btn.innerText = "Сделать ставку";
        btn.style.background = "#2e7d32";
      }
    }
  </script>
</body>
</html>
