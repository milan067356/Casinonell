<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 NellCasino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --card-border: #232a36;
      --accent-color: #0088cc;
      --accent-gold: #ffb703;
      --text-main: #ffffff;
      --text-muted: #8b96a5;
      --btn-green: #00c853;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 75px;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: rgba(21, 26, 35, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-pill {
      background: rgba(255, 183, 3, 0.12);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page {
      display: none;
      padding: 16px;
    }

    .page.active {
      display: block;
    }

    .market-title {
      text-align: center;
      margin-bottom: 16px;
    }

    .market-title h2 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .market-title p {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 3-Column NFT Grid */
    .nft-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .nft-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      aspect-ratio: 1 / 1.15;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .nft-card:active {
      transform: scale(0.95);
    }

    .nft-img-container {
      width: 100%;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin-bottom: 6px;
    }

    .price-pill {
      width: 100%;
      background: #1e2532;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 5px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-weight: 700;
      font-size: 12px;
      color: var(--accent-gold);
    }

    .games-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-info h3 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .game-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-play {
      background: var(--btn-green);
      color: #000;
      font-weight: 800;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* GAME MODAL SCREEN */
    #game-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(11, 14, 20, 0.95);
      z-index: 2000;
      padding: 24px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #game-modal h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    #game-screen {
      font-size: 48px;
      margin: 20px 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      padding: 30px;
      border-radius: 20px;
    }

    .promo-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .input-box {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: #0f131a;
      color: #fff;
      margin: 10px 0;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: var(--accent-color);
      color: #fff;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(21, 26, 35, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent-color);
    }

    .nav-icon {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-title">👑 NellCasino</div>
    <div class="balance-pill">
      <span>⭐</span> <span id="user-balance">1,000</span>
    </div>
  </div>

  <!-- GAMES PAGE -->
  <div id="page-games" class="page active">
    <div class="games-list">
      <div class="game-card">
        <div class="game-info">
          <h3>🎰 Slots</h3>
          <p>Классический слот с умножителями</p>
        </div>
        <button class="btn-play" onclick="openGame('Slots')">Играть</button>
      </div>

      <div class="game-card">
        <div class="game-info">
          <h3>⚪ Plinko</h3>
          <p>Падающие шарики и супер-бонусы</p>
        </div>
        <button class="btn-play" onclick="openGame('Plinko')">Играть</button>
      </div>

      <div class="game-card">
        <div class="game-info">
          <h3>🚀 Crash</h3>
          <p>Успей забрать иксы до взрыва</p>
        </div>
        <button class="btn-play" onclick="openGame('Crash')">Играть</button>
      </div>
    </div>
  </div>

  <!-- NFT MARKET PAGE -->
  <div id="page-nft" class="page">
    <div class="market-title">
      <h2>🖼️ Рынок NFT Подарков</h2>
      <p>Официальные 3D подарки Telegram Stars ⭐</p>
    </div>
    <div class="nft-grid" id="nft-container"></div>
  </div>

  <!-- PROFILE PAGE -->
  <div id="page-profile" class="page">
    <div class="promo-card">
      <h3>💳 Пополнение звезд ⭐</h3>
      <input type="number" id="depositInput" class="input-box" value="100">
      <button class="btn-action" onclick="makeDeposit()">Выставить чек</button>
    </div>

    <div class="promo-card">
      <h3>🎁 Вывод звезд</h3>
      <input type="number" id="withdrawInput" class="input-box" value="100">
      <button class="btn-action" style="background:#ff9800;" onclick="makeWithdraw()">Вывести звезды</button>
    </div>

    <div class="promo-card">
      <h3>👥 Реферальная система</h3>
      <input type="text" class="input-box" value="https://t.me/NellCasinobot" readonly>
      <button class="btn-action" style="background:rgba(255,255,255,0.1);" onclick="copyLink()">Скопировать ссылку</button>
    </div>
  </div>

  <!-- INTERACTIVE GAME MODAL -->
  <div id="game-modal">
    <h2 id="modal-title">Игра</h2>
    <div id="game-screen">🎰 💎 7️⃣</div>
    <button class="btn-action" style="background: var(--btn-green); color: #000; margin-bottom: 10px;" onclick="playRound()">Сделать ставку (50 ⭐)</button>
    <button class="btn-action" style="background: #e53935;" onclick="closeGame()">Закрыть игру</button>
  </div>

  <!-- NAVIGATION BAR -->
  <div class="nav-bar">
    <button class="nav-btn active" id="btn-games" onclick="showPage('games')">
      <span class="nav-icon">🎮</span>
      <span>Игры</span>
    </button>
    <button class="nav-btn" id="btn-nft" onclick="showPage('nft')">
      <span class="nav-icon">🖼️</span>
      <span>Рынок NFT</span>
    </button>
    <button class="nav-btn" id="btn-profile" onclick="showPage('profile')">
      <span class="nav-icon">👤</span>
      <span>Профиль</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let balance = 1000;
    let currentGame = '';

    // Полный официальный каталог 109 подарков с надежными иконками-эмодзі высокого качества
    const iconsList = ['🎁', '💎', '👑', '🧸', '🚀', '🔮', '🎃', '⏰', '⭐', '🍀', '🌹', '🎩', '🎈', '🍾', '🍩', '🔮'];
    
    const nftCatalog = [];
    for(let i = 0; i < 109; i++) {
      let price = 398 + i * 15 + (i % 7) * 3;
      nftCatalog.push({
        price: price,
        icon: iconsList[i % iconsList.length]
      });
    }

    function renderNFTs() {
      const container = document.getElementById('nft-container');
      container.innerHTML = '';

      nftCatalog.forEach(item => {
        const card = document.createElement('div');
        card.className = 'nft-card';
        card.onclick = () => buyNFT(item.price);

        card.innerHTML = `
          <div class="nft-img-container">
            <span>${item.icon}</span>
          </div>
          <div class="price-pill">
            <span>${item.price.toLocaleString()}</span> ⭐
          </div>
        `;
        container.appendChild(card);
      });
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

      document.getElementById(`page-${pageId}`).classList.add('active');
      document.getElementById(`btn-${pageId}`).classList.add('active');
    }

    function openGame(gameName) {
      currentGame = gameName;
      document.getElementById('modal-title').innerText = `Игра: ${gameName}`;
      document.getElementById('game-modal').style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('game-modal').style.display = 'none';
    }

    function playRound() {
      if (balance >= 50) {
        balance -= 50;
        document.getElementById('user-balance').innerText = balance.toLocaleString();
        
        const r1 = iconsList[Math.floor(Math.random() * iconsList.length)];
        const r2 = iconsList[Math.floor(Math.random() * iconsList.length)];
        const r3 = iconsList[Math.floor(Math.random() * iconsList.length)];
        
        document.getElementById('game-screen').innerText = `${r1} ${r2} ${r3}`;

        if (r1 === r2 && r2 === r3) {
          balance += 300;
          document.getElementById('user-balance').innerText = balance.toLocaleString();
          if (tg) tg.showAlert('🎉 ДЖЕКПОТ! Вы выиграли 300 звезд ⭐!');
        }
      } else {
        if (tg) tg.showAlert('⚠️ Недостаточно звезд для ставки!');
      }
    }

    function buyNFT(price) {
      if (balance >= price) {
        balance -= price;
        document.getElementById('user-balance').innerText = balance.toLocaleString();
        if (tg) tg.showAlert('🎉 Поздравляем с покупкой NFT подарка!');
      } else {
        if (tg) tg.showAlert(`⚠️ Недостаточно звезд. Нужно еще ${(price - balance).toLocaleString()} ⭐`);
      }
    }

    function makeDeposit() {
      const val = document.getElementById('depositInput').value;
      if (tg) tg.showAlert(`📥 Чек на ${val} ⭐ создан. Перейдите в бот для оплаты.`);
    }

    function makeWithdraw() {
      if (tg) tg.showAlert('📤 Заявка на вывод отправлена администратору @Navi4563.');
    }

    function copyLink() {
      navigator.clipboard.writeText('https://t.me/NellCasinobot');
      if (tg) tg.showAlert('📋 Реферальная ссылка скопирована!');
    }

    renderNFTs();
  </script>
</body>
</html>
