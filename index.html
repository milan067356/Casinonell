<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NellCasino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #121212;
      color: #ffffff;
      overflow: hidden;
    }

    /* Основний контейнер на весь екран */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      padding: 12px;
      gap: 10px;
    }

    /* Header */
    .header {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 16px;
      color: #ffd700;
    }

    .balance-badge {
      background: #2a2a2a;
      padding: 5px 10px;
      border-radius: 16px;
      font-weight: 700;
      color: #ffd700;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #ffcc0033;
    }

    /* Top-up Card */
    .topup-card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .topup-input {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .topup-btn {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(245, 124, 0, 0.4);
      white-space: nowrap;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      background: #2a2a2a;
      border: none;
      color: #aaa;
      padding: 8px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: #ff9800;
      color: #fff;
    }

    /* Game Card - Займає весь залишок висоти екрана */
    .game-card {
      background: #1e1e1e;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-height: 0;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .game-title {
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* Краш Повноекранне поле */
    .crash-container {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 180px;
      background: radial-gradient(circle at bottom left, #141824, #090b10);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2d3245;
    }

    #crashCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .multiplier-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 44px;
      font-weight: 900;
      color: #4caf50;
      text-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
      pointer-events: none;
    }

    .multiplier-overlay.crashed {
      color: #f44336;
      text-shadow: 0 0 15px rgba(244, 67, 54, 0.6);
    }

    /* Bet Box */
    .bet-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .bet-label {
      font-size: 12px;
      color: #aaa;
    }

    .bet-input {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      outline: none;
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #4caf50, #388e3c);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
      flex-shrink: 0;
    }

    .action-btn.cashout {
      background: linear-gradient(135deg, #ff9800, #f57c00);
      box-shadow: 0 4px 10px rgba(245, 124, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Header -->
    <div class="header">
      <div class="brand">🎰 NellCasino</div>
      <div class="balance-badge"><span id="userBalance">0</span> ⭐</div>
    </div>

    <!-- Deposit Form -->
    <div class="topup-card">
      <input type="number" id="starsAmount" class="topup-input" value="100" min="10">
      <button class="topup-btn" onclick="requestDeposit()">💳 Выставить чек</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn" onclick="switchGame('slots')">Слоты 777</button>
      <button class="tab-btn" onclick="switchGame('plinko')">Плинко</button>
      <button class="tab-btn active" onclick="switchGame('crash')">Краш</button>
    </div>

    <!-- Crash Fullscreen Game Card -->
    <div id="crashGame" class="game-card">
      <div class="game-title">🚀 Краш Ракета</div>

      <div class="crash-container">
        <canvas id="crashCanvas"></canvas>
        <div id="multiplierText" class="multiplier-overlay">1.00x</div>
      </div>

      <div class="bet-box">
        <div class="bet-label">Размер ставки (мин. 25 ⭐):</div>
        <input type="number" id="betAmount" class="bet-input" value="25" min="25">
      </div>

      <button id="mainGameBtn" class="action-btn" onclick="handleGameClick()">Сделать ставку</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let balance = 0;
    let gameState = 'idle';
    let currentMultiplier = 1.00;
    let crashPoint = 1.00;
    let animId = null;

    const canvas = document.getElementById('crashCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    setTimeout(resizeCanvas, 100);
    window.addEventListener('resize', resizeCanvas);

    const stars = Array.from({ length: 45 }, () => ({
      x: Math.random() * 300,
      y: Math.random() * 200,
      r: Math.random() * 1.5 + 0.5,
      alpha: Math.random()
    }));

    function drawScene(progress = 0, isCrashed = false) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc((s.x * canvas.width) / 300, (s.y * canvas.height) / 200, s.r, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.strokeStyle = '#232838';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.height; i += 35) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      if (gameState === 'idle') return;

      const startX = 20;
      const startY = canvas.height - 20;
      const endX = Math.min(startX + (canvas.width - 40) * progress, canvas.width - 40);
      const endY = Math.max(startY - (canvas.height - 40) * progress, 30);

      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.quadraticCurveTo(startX + (endX - startX) / 2, startY, endX, endY);
      ctx.strokeStyle = isCrashed ? '#f44336' : '#ff9800';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.lineTo(endX, startY);
      ctx.lineTo(startX, startY);
      ctx.fillStyle = isCrashed ? 'rgba(244, 67, 54, 0.15)' : 'rgba(255, 152, 0, 0.15)';
      ctx.fill();

      if (!isCrashed) {
        ctx.font = '26px serif';
        ctx.fillText('🚀', endX - 14, endY + 8);
      } else {
        ctx.font = '30px serif';
        ctx.fillText('💥', endX - 15, endY + 10);
      }
    }

    drawScene();

    function requestDeposit() {
      const amount = parseInt(document.getElementById('starsAmount').value);
      if (isNaN(amount) || amount < 10) {
        alert('Минимальная сумма пополнения — 10 ⭐');
        return;
      }

      const payload = JSON.stringify({
        action: 'deposit',
        amount: amount
      });

      if (tg) {
        tg.sendData(payload);
      }
    }

    function handleGameClick() {
      const btn = document.getElementById('mainGameBtn');
      const multText = document.getElementById('multiplierText');
      const betInput = document.getElementById('betAmount');
      const bet = parseInt(betInput.value);

      if (gameState === 'idle') {
        if (balance < bet) {
          alert('Недостаточно звезд на балансе! Выставьте чек для пополнения.');
          return;
        }

        balance -= bet;
        document.getElementById('userBalance').innerText = balance;

        gameState = 'running';
        currentMultiplier = 1.00;
        
        // Переважає вибух на низькому коефіцієнті
        const rand = Math.random();
        if (rand < 0.70) {
          crashPoint = (1.01 + Math.random() * 0.19).toFixed(2);
        } else {
          crashPoint = (1.21 + Math.random() * 2.0).toFixed(2);
        }

        btn.innerText = 'Забрать выигрыш';
        btn.classList.add('cashout');
        multText.classList.remove('crashed');

        let startTime = Date.now();

        function animate() {
          let elapsed = (Date.now() - startTime) / 1000;
          currentMultiplier = (1 + elapsed * 0.35).toFixed(2);

          if (parseFloat(currentMultiplier) >= parseFloat(crashPoint)) {
            gameState = 'crashed';
            multText.innerText = crashPoint + 'x';
            multText.classList.add('crashed');
            btn.innerText = 'Сделать ставку';
            btn.classList.remove('cashout');
            drawScene(1, true);
            setTimeout(() => { gameState = 'idle'; }, 1000);
            return;
          }

          multText.innerText = currentMultiplier + 'x';
          let progress = Math.min((currentMultiplier - 1) / 2.5, 1);
          drawScene(progress, false);

          animId = requestAnimationFrame(animate);
        }

        animate();

      } else if (gameState === 'running') {
        cancelAnimationFrame(animId);
        let winAmount = Math.floor(bet * parseFloat(currentMultiplier));
        balance += winAmount;
        document.getElementById('userBalance').innerText = balance;

        gameState = 'idle';
        alert(`🎉 Вы забрали ${winAmount} ⭐ (х${currentMultiplier})!`);

        btn.innerText = 'Сделать ставку';
        btn.classList.remove('cashout');
      }
    }

    function switchGame(game) {
      if (game !== 'crash') {
        alert('Раздел находится в разработке');
      }
    }
  </script>
</body>
</html>
