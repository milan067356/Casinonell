<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casinonell</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; }
        .balance-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 18px;
        }
        .multiplier {
            font-size: 48px;
            font-weight: bold;
            color: #4ade80;
            margin: 30px 0;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
        }
        button:active { background-color: #1d4ed8; }
        input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Casinonell</h1>
    <p style="color: #94a3b8; font-size: 14px;">Додаток успішно підключено до Telegram!</p>

    <div class="balance-card">
        Баланс: <span id="balance">0</span> ⭐
    </div>

    <div class="multiplier" id="multiplier">1.00x</div>

    <div>
        <input type="number" id="betAmount" placeholder="Сума ставки" value="10">
        <br>
        <button id="actionBtn" onclick="placeBet()">Зробити ставку</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Отримуємо user_id з Telegram або використовуємо тестовий
        const userId = tg.initDataUnsafe?.user?.id || 123456789;

        async function updateState() {
            try {
                let response = await fetch(`/api/state?user_id=${userId}`);
                let data = await response.json();
                
                document.getElementById('balance').innerText = data.balance;
                if (data.current_multiplier) {
                    document.getElementById('multiplier').innerText = data.current_multiplier.toFixed(2) + 'x';
                }
            } catch (e) {
                console.error("Помилка оновлення стану:", e);
            }
        }

        async function placeBet() {
            let amount = parseFloat(document.getElementById('betAmount').value);
            let response = await fetch('/api/bet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, amount: amount })
            });
            let result = await response.json();
            if (result.ok) {
                alert("Ставку прийнято!");
                updateState();
            } else {
                alert("Помилка: " + (result.error || "Не вдалося зробити ставку"));
            }
        }

        // Оновлюємо стан кожні 500 мс
        setInterval(updateState, 500);
    </script>
</body>
</html>
