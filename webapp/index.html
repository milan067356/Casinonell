<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>allDep</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070d1a;
            --header-bg: #10192d;
            --card-bg: linear-gradient(145deg, #16223b, #0c1322);
            --border-color: #263854;
            --accent-color: #00ffcc;
            --accent-glow: 0 0 22px rgba(0,255,204,0.42), inset 0 0 12px rgba(0,255,204,0.14);
            --btn-glow: 0 4px 22px rgba(0,255,204,0.38);
            --text-color: #ffffff;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 95px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .logo-font {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-color), #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-box {
            background: var(--header-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #facc15;
            border: 1px solid var(--border-color);
        }
        .screen { display: none; padding: 16px; }
        .screen.active { display: block; }
        .main-title {
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            margin: 10px 0 20px 0;
        }
        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .game-card {
            position: relative;
            background: var(--card-bg);
            border-radius: 22px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            box-shadow: var(--btn-glow);
            min-height: 148px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }
        .game-card:active { transform: scale(0.96); }
        .game-emoji { font-size: 40px; line-height: 1.1; }
        .game-title {
            font-size: 19px;
            font-weight: 900;
            margin-top: 8px;
            font-family: 'Outfit', sans-serif;
        }

        /* Краш */
        .crash-screen { text-align: center; }
        .rocket-container {
            position: relative;
            height: 250px;
            margin: 10px 0;
            background: #060b16;
            border-radius: 24px;
            border: 1.5px solid rgba(56, 189, 248, 0.35);
            overflow: hidden;
            box-shadow: var(--accent-glow);
        }
        #crashCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .multiplier-pill {
            position: relative;
            z-index: 4;
            display: inline-block;
            margin-top: 16px;
            background: rgba(11, 19, 36, 0.82);
            border: 1.5px solid rgba(56, 189, 248, 0.45);
            border-radius: 20px;
            padding: 8px 24px;
        }
        .multiplier-pill.crashed { border-color: rgba(239, 68, 68, 0.8); }
        .multiplier {
            font-size: 42px;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            margin: 0;
        }
        .history-bar {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding: 8px 10px;
            background: var(--header-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
            white-space: nowrap;
        }
        .history-chip {
            background: #172540;
            padding: 5px 11px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 800;
            color: #38bdf8;
        }
        .bets-list {
            background: var(--header-bg);
            border-radius: 16px;
            padding: 12px;
            margin: 12px 0;
            max-height: 170px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid var(--border-color);
        }
        .bet-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .bet-item:last-child { border-bottom: none; }
        .bet-user { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .bet-user img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        .bet-amount { color: #facc15; font-weight: 800; }

        .bet-control-box {
            background: var(--header-bg);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid var(--border-color);
            margin-top: 12px;
        }
        .quick-btns { display: flex; gap: 8px; margin-top: 10px; }
        .quick-btn {
            flex: 1;
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        input {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            background: #0b0f19;
            color: white;
            text-align: center;
            font-weight: bold;
        }
        .btn-action {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            border-radius: 14px;
            border: none;
            margin-top: 10px;
            font-weight: 900;
            font-family: 'Outfit', sans-serif;
            background: var(--accent-color);
            color: #0b0f19;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-cashout {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 22px rgba(16, 185, 129, 0.5);
        }

        /* Гра Белочка */
        .squirrel-board {
            background: linear-gradient(180deg, #0d1a33 0%, #071021 100%);
            border: 1.5px solid rgba(56, 189, 248, 0.35);
            border-radius: 22px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .squirrel-top-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #cbd5e1;
        }
        .squirrel-steps {
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
        }
        .squirrel-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr) 68px;
            gap: 8px;
            align-items: center;
        }
        .squirrel-tile {
            height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: #132038;
            color: #e2e8f0;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.12s ease, background 0.2s ease, border-color 0.2s ease;
        }
        .squirrel-tile.active-row {
            border-color: var(--accent-color);
            background: #182b4d;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
        }
        .squirrel-tile.active-row:hover { background: #213863; }
        .squirrel-tile.safe-picked {
            background: rgba(16, 185, 129, 0.28);
            border-color: #10b981;
            color: #6ee7b7;
        }
        .squirrel-tile.trap-hit {
            background: rgba(239, 68, 68, 0.32);
            border-color: #ef4444;
            color: #fca5a5;
        }
        .squirrel-tile.trap-reveal {
            background: rgba(239, 68, 68, 0.14);
            border-color: rgba(239, 68, 68, 0.45);
            color: #f87171;
            opacity: 0.75;
        }
        .squirrel-mult-badge {
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            font-size: 13px;
            color: #facc15;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 10px;
            padding: 8px 4px;
        }
        .diff-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .diff-btn {
            padding: 10px 8px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #142038;
            color: #cbd5e1;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }
        .diff-btn.active {
            border-color: var(--accent-color);
            background: rgba(0, 255, 204, 0.16);
            color: #ffffff;
        }

        .profile-card {
            background: var(--header-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--header-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            width: 50%;
            font-family: 'Outfit', sans-serif;
        }
        .nav-item.active { color: var(--accent-color); }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-font">allDep</div>
        <div class="balance-box">⭐ <span id="userBalance">15</span></div>
    </div>

    <div id="screen-games" class="screen active">
        <div class="main-title">ГЛАВНАЯ</div>
        <div class="games-grid">
            <div class="game-card" onclick="switchScreen('crash')">
                <div class="game-emoji">🚀</div>
                <div class="game-title">Краш</div>
            </div>
            <div class="game-card" onclick="switchScreen('squirrel')">
                <div class="game-emoji">🐿️</div>
                <div class="game-title">Белочка</div>
            </div>
            <div class="game-card" onclick="switchScreen('profile')">
                <div class="game-emoji">🎁</div>
                <div class="game-title">Кейсы</div>
            </div>
            <div class="game-card" onclick="switchScreen('profile')">
                <div class="game-emoji">👤</div>
                <div class="game-title">Профиль</div>
            </div>
        </div>
    </div>

    <div id="screen-crash" class="screen crash-screen">
        <button onclick="switchScreen('games')" style="background:none; color:var(--accent-color); border:none; font-size:14px; cursor:pointer; float:left;">← Назад в меню</button>
        <div style="clear:both;"></div>

        <div style="font-size: 14px; font-weight: 800; color: #38bdf8; margin-bottom: 6px;" id="crashStatus">Ожидание ставки (7с)</div>

        <div class="rocket-container" id="rocketArena">
            <canvas id="crashCanvas"></canvas>
            <div class="multiplier-pill" id="multiplierPill">
                <div class="multiplier" id="crashMultiplier">1.00x</div>
            </div>
        </div>

        <div class="history-bar" id="historyBar"></div>

        <div class="bets-list" id="betsList"></div>

        <div class="bet-control-box" id="betControlBox">
            <div id="crashInputSection">
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">Сумма ставки (без лимита)</div>
                <input type="text" inputmode="numeric" id="crashBetInput" value="1000">
                <div class="quick-btns">
                    <button class="quick-btn" onclick="addCrashBet(-500)">-500</button>
                    <button class="quick-btn" onclick="addCrashBet(1000)">+1K</button>
                    <button class="quick-btn" onclick="addCrashBet(10000)">+10K</button>
                    <button class="quick-btn" onclick="setMaxCrashBet()">MAX</button>
                </div>
            </div>
            <button class="btn-action" id="crashActionBtn" onclick="handleCrashBet()">Сделать ставку</button>
        </div>
    </div>

    <div id="screen-squirrel" class="screen">
        <button onclick="switchScreen('games')" style="background:none; color:var(--accent-color); border:none; font-size:14px; cursor:pointer; margin-bottom:8px;">← Назад в меню</button>
        <div class="main-title" style="margin-top:0;">Белочка</div>

        <div class="squirrel-board">
            <div class="squirrel-top-info">
                <span>Персонаж: <strong style="color:#fde047;">🐿️ Белочка</strong></span>
                <span id="squirrelStatusText">Выберите уровень и ставку</span>
            </div>
            <div class="squirrel-steps" id="squirrelSteps"></div>
        </div>

        <div class="bet-control-box">
            <div id="squirrelSetupSection">
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">Сумма ставки</div>
                <input type="text" inputmode="numeric" id="squirrelBetInput" value="100">

                <div class="diff-grid">
                    <button class="diff-btn active" id="diff-easy" onclick="setSquirrelDifficulty('easy')">Лёгкий</button>
                    <button class="diff-btn" id="diff-medium" onclick="setSquirrelDifficulty('medium')">Средний</button>
                    <button class="diff-btn" id="diff-hard" onclick="setSquirrelDifficulty('hard')">Тяжёлый</button>
                    <button class="diff-btn" id="diff-impossible" onclick="setSquirrelDifficulty('impossible')">Невозможный</button>
                </div>

                <button class="btn-action" onclick="startSquirrelGame()">Начать игру</button>
            </div>

            <button class="btn-action btn-cashout" id="squirrelCashoutBtn" style="display:none;" onclick="cashoutSquirrelGame()">
                Забрать выигрыш
            </button>
        </div>
    </div>

    <div id="screen-profile" class="screen">
        <div class="main-title">Профиль</div>
        <div class="profile-card">
            <div style="font-size: 14px; color: var(--text-muted);">Баланс звезд</div>
            <div style="font-size: 32px; font-weight: bold; color: #facc15; margin: 8px 0 16px 0; font-family: 'Outfit', sans-serif;">
                ⭐ <span id="profileBalance">15</span>
            </div>
            <input type="text" id="promoInput" placeholder="ВВЕДИТЕ ПРОМОКОД" style="text-transform: uppercase;">
            <button class="btn-action" onclick="activatePromo()">ПРИМЕНИТЬ</button>
            <div id="promoStatus" style="margin-top: 10px; font-size: 13px; font-weight: 700; color: #4ade80;"></div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" onclick="switchScreen('games')" id="navGames">🏠 Главная</button>
        <button class="nav-item" onclick="switchScreen('profile')" id="navProfile">👤 Профиль</button>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg && typeof tg.expand === "function") {
            try { tg.expand(); } catch (e) {}
        }

        const balKey = "allDep_bal_v8";
        let balance = Number(localStorage.getItem(balKey));
        if (!Number.isFinite(balance) || balance < 0) balance = 15;

        function fmt(n) {
            return Math.floor(Number(n) || 0).toLocaleString("ru-RU");
        }

        function updateBalance() {
            localStorage.setItem(balKey, String(balance));
            document.getElementById("userBalance").innerText = fmt(balance);
            document.getElementById("profileBalance").innerText = fmt(balance);
        }

        function switchScreen(name) {
            document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
            document.getElementById("screen-" + name).classList.add("active");
            document.querySelectorAll(".nav-item").forEach(el => el.classList.remove("active"));
            document.getElementById(name === "profile" ? "navProfile" : "navGames").classList.add("active");
            if (name === "crash") resizeCrashCanvas();
        }

        function activatePromo() {
            const inp = document.getElementById("promoInput");
            const st = document.getElementById("promoStatus");
            const code = (inp.value || "").trim().toLowerCase();
            if (code === "s") {
                balance += 1000000;
                updateBalance();
                inp.value = "";
                st.style.color = "#4ade80";
                st.innerText = "✅ Промокод «S»: +1 000 000 ⭐ начислено";
            } else {
                st.style.color = "#f87171";
                st.innerText = "Неверный промокод";
            }
        }

        /* ================= КРАШ ================= */
        let crashPhase = "waiting";
        let crashCountdown = 7;
        let crashMultiplier = 1.00;
        let crashPoint = 1.60;
        let crashMyBet = 0;
        let crashHasBet = false;
        let crashCashed = false;
        let crashInterval = null;
        let crashTimerInterval = null;
        let crashHistory = ["1.41x", "6.11x", "4.63x", "22.91x", "3.10x", "9.19x", "2.84x", "1.88x"];

        const fakeBots = [
            { name: "neon_whale", avatar: "https://i.pravatar.cc/100?img=15" },
            { name: "zenith_pro", avatar: "https://i.pravatar.cc/100?img=37" },
            { name: "orbit_fox", avatar: "https://i.pravatar.cc/100?img=18" },
            { name: "nova_drift", avatar: "https://i.pravatar.cc/100?img=29" },
            { name: "blaze_99", avatar: "https://i.pravatar.cc/100?img=59" },
            { name: "star_hunter", avatar: "https://i.pravatar.cc/100?img=41" },
            { name: "lunar_x", avatar: "https://i.pravatar.cc/100?img=47" },
            { name: "phantom_z", avatar: "https://i.pravatar.cc/100?img=61" },
            { name: "krypton_7", avatar: "https://i.pravatar.cc/100?img=56" }
        ];
        let roundBots = [];
        let lastBots = new Set();

        function addCrashBet(delta) {
            const inp = document.getElementById("crashBetInput");
            const cur = parseInt((inp.value || "0").replace(/\D/g, ""), 10) || 0;
            inp.value = String(Math.max(1, cur + delta));
        }

        function setMaxCrashBet() {
            document.getElementById("crashBetInput").value = String(balance > 0 ? balance : 1);
        }

        function syncCrashControls() {
            const inputSection = document.getElementById("crashInputSection");
            const btn = document.getElementById("crashActionBtn");

            if (crashHasBet && !crashCashed) {
                // Ховаємо поле введення ставки і показуємо кнопку "Забрать ставку"
                inputSection.style.display = "none";
                if (crashPhase === "flying") {
                    const winNow = Math.floor(crashMyBet * crashMultiplier);
                    btn.className = "btn-action btn-cashout";
                    btn.disabled = false;
                    btn.innerText = `Забрать ставку (${fmt(winNow)} ⭐)`;
                    btn.onclick = cashoutCrash;
                } else if (crashPhase === "waiting") {
                    btn.className = "btn-action";
                    btn.disabled = true;
                    btn.innerText = `Ставка принята (${fmt(crashMyBet)} ⭐)`;
                    btn.onclick = null;
                } else {
                    btn.className = "btn-action";
                    btn.disabled = true;
                    btn.innerText = "Раунд завершен";
                    btn.onclick = null;
                }
            } else {
                inputSection.style.display = "block";
                if (crashPhase === "waiting") {
                    btn.className = "btn-action";
                    btn.disabled = false;
                    btn.innerText = "Сделать ставку";
                    btn.onclick = handleCrashBet;
                } else if (crashPhase === "flying") {
                    btn.className = "btn-action";
                    btn.disabled = true;
                    btn.innerText = "Раунд идет...";
                    btn.onclick = null;
                } else {
                    btn.className = "btn-action";
                    btn.disabled = true;
                    btn.innerText = "Раунд завершен";
                    btn.onclick = null;
                }
            }
        }

        function renderCrashBets() {
            const box = document.getElementById("betsList");
            let html = "";
            if (crashHasBet) {
                const statusTag = crashCashed ? " · ✅ забрано" : "";
                html += `<div class="bet-item" style="color:var(--accent-color);font-weight:bold;">
                    <div class="bet-user"><span>Вы (Ставка)${statusTag}</span></div>
                    <span class="bet-amount">⭐ ${fmt(crashMyBet)}</span>
                </div>`;
            }
            roundBots.forEach(b => {
                html += `<div class="bet-item">
                    <div class="bet-user"><img src="${b.avatar}" alt=""><span>${b.name}</span></div>
                    <span class="bet-amount">⭐ ${fmt(b.amount)}</span>
                </div>`;
            });
            box.innerHTML = html || `<div class="bet-item"><span>Участники раунда</span><span>0</span></div>`;
        }

        function renderCrashHistory() {
            document.getElementById("historyBar").innerHTML = crashHistory
                .slice(-8)
                .map(x => `<span class="history-chip">${x}</span>`).join("");
        }

        function handleCrashBet() {
            const amount = parseInt((document.getElementById("crashBetInput").value || "0").replace(/\D/g, ""), 10) || 0;
            if (amount < 1) return alert("Введите сумму ставки от 1 звезды.");
            if (balance < amount) return alert("Недостаточно звезд на балансе.");
            balance -= amount;
            crashMyBet = amount;
            crashHasBet = true;
            crashCashed = false;
            updateBalance();
            renderCrashBets();
            syncCrashControls();
        }

        function cashoutCrash() {
            if (!crashHasBet || crashCashed || crashPhase !== "flying") return;
            crashCashed = true;
            const win = Math.floor(crashMyBet * crashMultiplier);
            balance += win;
            updateBalance();
            document.getElementById("crashStatus").innerText = `🎉 Вы забрали на ${crashMultiplier.toFixed(2)}x (+${fmt(win)} ⭐)!`;
            renderCrashBets();
            syncCrashControls();
        }

        function startCrashWaiting() {
            clearInterval(crashInterval);
            clearInterval(crashTimerInterval);
            crashPhase = "waiting";
            crashCountdown = 7;
            crashMultiplier = 1.00;
            crashHasBet = false;
            crashCashed = false;
            crashMyBet = 0;

            const count = Math.floor(Math.random() * 6) + 4; // 4..9 ботов
            const pool = fakeBots.filter(u => !lastBots.has(u.name));
            const chosen = (pool.length >= count ? pool : fakeBots)
                .slice()
                .sort(() => Math.random() - 0.5)
                .slice(0, count);

            roundBots = chosen.map(u => ({
                name: u.name,
                avatar: u.avatar,
                amount: Math.floor(Math.random() * 9985) + 15 // до 10 000
            }));
            lastBots = new Set(roundBots.map(b => b.name));

            document.getElementById("multiplierPill").classList.remove("crashed");
            document.getElementById("crashMultiplier").innerText = "1.00x";
            document.getElementById("crashStatus").innerText = `Ожидание ставки (${crashCountdown}с)`;
            renderCrashBets();
            syncCrashControls();

            crashTimerInterval = setInterval(() => {
                crashCountdown--;
                if (crashCountdown > 0) {
                    document.getElementById("crashStatus").innerText = `Ожидание ставки (${crashCountdown}с)`;
                } else {
                    clearInterval(crashTimerInterval);
                    startCrashFlight();
                }
            }, 1000);
        }

        function startCrashFlight() {
            crashPhase = "flying";
            crashMultiplier = 1.00;
            crashPoint = parseFloat((1.2 + Math.random() * 6.5).toFixed(2));
            document.getElementById("crashStatus").innerText = "🚀 Ракета летит!";
            syncCrashControls();

            crashInterval = setInterval(() => {
                crashMultiplier = parseFloat((crashMultiplier + 0.04).toFixed(2));
                document.getElementById("crashMultiplier").innerText = crashMultiplier.toFixed(2) + "x";
                if (crashHasBet && !crashCashed) {
                    syncCrashControls();
                }
                if (crashMultiplier >= crashPoint) {
                    clearInterval(crashInterval);
                    crashPhase = "crashed";
                    document.getElementById("multiplierPill").classList.add("crashed");
                    document.getElementById("crashStatus").innerText = `💥 Ракета взорвалась на ${crashPoint.toFixed(2)}x!`;
                    crashHistory.push(crashPoint.toFixed(2) + "x");
                    renderCrashHistory();
                    syncCrashControls();
                    setTimeout(startCrashWaiting, 3200);
                }
            }, 100);
        }

        const crashCanvas = document.getElementById("crashCanvas");
        const crashCtx = crashCanvas.getContext("2d");
        function resizeCrashCanvas() {
            const box = document.getElementById("rocketArena");
            if (!box || !box.offsetWidth) return;
            crashCanvas.width = box.offsetWidth;
            crashCanvas.height = box.offsetHeight;
        }
        function drawCrashFrame(t) {
            if (!crashCanvas.width) resizeCrashCanvas();
            const w = crashCanvas.width || 320;
            const h = crashCanvas.height || 250;
            crashCtx.clearRect(0, 0, w, h);
            crashCtx.fillStyle = "#071024";
            crashCtx.fillRect(0, 0, w, h);

            const prog = crashPhase === "flying" ? Math.min(1, Math.max(0.08, (crashMultiplier - 1) / 3.5)) : 0.14;
            const rx = 56 + prog * (w - 125) + Math.sin(t * 0.005) * 4;
            const ry = (h - 42) - prog * (h - 108) + Math.cos(t * 0.006) * 4;

            crashCtx.strokeStyle = crashPhase === "crashed" ? "#ef4444" : "#38bdf8";
            crashCtx.lineWidth = 4;
            crashCtx.beginPath();
            crashCtx.moveTo(46, h - 28);
            crashCtx.quadraticCurveTo(w * 0.45, h - 32, rx, ry);
            crashCtx.stroke();

            crashCtx.save();
            crashCtx.translate(rx, ry);
            crashCtx.rotate(0.55);
            crashCtx.fillStyle = "#f8fafc";
            crashCtx.beginPath();
            crashCtx.moveTo(0, -18);
            crashCtx.lineTo(11, 10);
            crashCtx.lineTo(-11, 10);
            crashCtx.closePath();
            crashCtx.fill();
            crashCtx.fillStyle = "#ef4444";
            crashCtx.fillRect(-9, -7, 18, 5);
            crashCtx.restore();

            requestAnimationFrame(drawCrashFrame);
        }

        /* ================= ГРА БЕЛОЧКА ================= */
        const SQUIRREL_ROWS = 8;
        const SQUIRREL_COLS = 3;
        const SQUIRREL_DIFFS = {
            easy:       { label: "Лёгкий",     trapsPerRow: 1, stepMult: 1.28 },
            medium:     { label: "Средний",    trapsPerRow: 1, stepMult: 1.52 },
            hard:       { label: "Тяжёлый",    trapsPerRow: 2, stepMult: 2.15 },
            impossible: { label: "Невозможный",trapsPerRow: 2, stepMult: 3.10 }
        };

        let sqDiffKey = "easy";
        let sqActive = false;
        let sqBet = 0;
        let sqCurrentRow = 0; // 0..7
        let sqCurrentMult = 1.00;
        let sqGridTraps = []; // масив масивів індексів пасток на кожному ряду
        let sqPickedCols = []; // обрана колонка на кожному пройденому ряду
        let sqHitTrap = null; // { row, col } якщо наступив на пастку

        function setSquirrelDifficulty(key) {
            if (sqActive) return;
            sqDiffKey = key;
            document.querySelectorAll(".diff-btn").forEach(b => b.classList.remove("active"));
            document.getElementById("diff-" + key).classList.add("active");
            renderSquirrelBoard();
        }

        function getRowMultiplier(rowIndex) {
            const mult = Math.pow(SQUIRREL_DIFFS[sqDiffKey].stepMult, rowIndex + 1);
            return parseFloat(mult.toFixed(2));
        }

        function generateSquirrelTraps() {
            const trapsCount = SQUIRREL_DIFFS[sqDiffKey].trapsPerRow;
            sqGridTraps = [];
            for (let r = 0; r < SQUIRREL_ROWS; r++) {
                const cols = [0, 1, 2].sort(() => Math.random() - 0.5);
                sqGridTraps.push(cols.slice(0, trapsCount));
            }
        }

        function startSquirrelGame() {
            const amount = parseInt((document.getElementById("squirrelBetInput").value || "0").replace(/\D/g, ""), 10) || 0;
            if (amount < 1) return alert("Введите сумму ставки от 1 звезды.");
            if (balance < amount) return alert("Недостаточно звезд на балансе.");

            balance -= amount;
            sqBet = amount;
            sqActive = true;
            sqCurrentRow = 0;
            sqCurrentMult = 1.00;
            sqPickedCols = [];
            sqHitTrap = null;
            generateSquirrelTraps();
            updateBalance();

            document.getElementById("squirrelSetupSection").style.display = "none";
            const cashBtn = document.getElementById("squirrelCashoutBtn");
            cashBtn.style.display = "block";
            cashBtn.disabled = true;
            cashBtn.innerText = "Сделайте первый шаг";
            document.getElementById("squirrelStatusText").innerText = `Уровень: ${SQUIRREL_DIFFS[sqDiffKey].label}`;
            renderSquirrelBoard();
        }

        function pickSquirrelTile(rowIdx, colIdx) {
            if (!sqActive || rowIdx !== sqCurrentRow) return;

            const isTrap = sqGridTraps[rowIdx].includes(colIdx);
            sqPickedCols[rowIdx] = colIdx;

            if (isTrap) {
                sqActive = false;
                sqHitTrap = { row: rowIdx, col: colIdx };
                document.getElementById("squirrelSetupSection").style.display = "block";
                document.getElementById("squirrelCashoutBtn").style.display = "none";
                document.getElementById("squirrelStatusText").innerText = `💥 Белочка попала в ловушку! Проигрыш ${fmt(sqBet)} ⭐`;
                renderSquirrelBoard();
                return;
            }

            sqCurrentMult = getRowMultiplier(rowIdx);
            sqCurrentRow++;

            // Якщо дійшли до вершини — автоматичний виграш
            if (sqCurrentRow >= SQUIRREL_ROWS) {
                const win = Math.floor(sqBet * sqCurrentMult);
                balance += win;
                updateBalance();
                sqActive = false;
                document.getElementById("squirrelSetupSection").style.display = "block";
                document.getElementById("squirrelCashoutBtn").style.display = "none";
                document.getElementById("squirrelStatusText").innerText = `🏆 Победа! Выигрыш ${fmt(win)} ⭐ (${sqCurrentMult.toFixed(2)}x)`;
                renderSquirrelBoard();
                return;
            }

            const cashBtn = document.getElementById("squirrelCashoutBtn");
            cashBtn.disabled = false;
            cashBtn.innerText = `Забрать выигрыш (${fmt(Math.floor(sqBet * sqCurrentMult))} ⭐)`;
            document.getElementById("squirrelStatusText").innerText = `Множитель: ${sqCurrentMult.toFixed(2)}x`;
            renderSquirrelBoard();
        }

        function cashoutSquirrelGame() {
            if (!sqActive || sqCurrentRow === 0) return;
            const win = Math.floor(sqBet * sqCurrentMult);
            balance += win;
            updateBalance();
            sqActive = false;

            document.getElementById("squirrelSetupSection").style.display = "block";
            document.getElementById("squirrelCashoutBtn").style.display = "none";
            document.getElementById("squirrelStatusText").innerText = `✅ Забрано ${fmt(win)} ⭐ (${sqCurrentMult.toFixed(2)}x)!`;
            renderSquirrelBoard();
        }

        function renderSquirrelBoard() {
            const container = document.getElementById("squirrelSteps");
            let html = "";

            for (let r = 0; r < SQUIRREL_ROWS; r++) {
                const rowMult = getRowMultiplier(r).toFixed(2) + "x";
                const isCurrent = sqActive && r === sqCurrentRow;
                let tilesHtml = "";

                for (let c = 0; c < SQUIRREL_COLS; c++) {
                    let cls = "squirrel-tile";
                    let content = "🌰";

                    if (r < sqCurrentRow && sqPickedCols[r] === c) {
                        cls += " safe-picked";
                        content = "🐿️";
                    } else if (sqHitTrap && sqHitTrap.row === r && sqHitTrap.col === c) {
                        cls += " trap-hit";
                        content = "💥";
                    } else if (!sqActive && sqGridTraps.length && sqGridTraps[r] && sqGridTraps[r].includes(c)) {
                        cls += " trap-reveal";
                        content = "🪤";
                    } else if (isCurrent) {
                        cls += " active-row";
                        content = c === 1 ? "🐿️" : "🌰";
                    }

                    tilesHtml += `<button class="${cls}" ${isCurrent ? `onclick="pickSquirrelTile(${r},${c})"` : "disabled"}>${content}</button>`;
                }

                html += `<div class="squirrel-row">${tilesHtml}<div class="squirrel-mult-badge">${rowMult}</div></div>`;
            }

            container.innerHTML = html;
        }

        updateBalance();
        renderCrashHistory();
        startCrashWaiting();
        resizeCrashCanvas();
        window.addEventListener("resize", resizeCrashCanvas);
        requestAnimationFrame(drawCrashFrame);
        renderSquirrelBoard();
    </script>
</body>
</html>
