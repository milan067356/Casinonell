<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>allDep</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            padding-bottom: 75px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #131b2e;
            border-bottom: 1px solid #1e293b;
        }
        .logo-font {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .balance-box {
            background: #1e293b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #facc15;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .screen { display: none; padding: 20px; }
        .screen.active { display: block; }
        
        .main-title {
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            margin: 10px 0 20px 0;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .game-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 20px;
            padding: 25px 10px;
            text-align: center;
            border: 1px solid #334155;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        .game-card:active { transform: scale(0.95); }
        .game-icon { font-size: 50px; margin-bottom: 10px; }
        .game-title { font-size: 18px; font-weight: bold; color: #ffffff; }

        .crash-screen { text-align: center; }
        .rocket-container {
            position: relative;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            background: radial-gradient(circle, #1e293b 0%, #0b0f19 80%);
            border-radius: 16px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        .rocket { font-size: 55px; transition: transform 0.1s linear; }
        .fire {
            font-size: 24px;
            margin-top: -10px;
            animation: flicker 0.2s infinite alternate;
        }
        @keyframes flicker {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .multiplier { font-size: 48px; font-weight: bold; color: #4ade80; margin: 10px 0; }
        
        .bets-list { 
            background: #131b2e; 
            border-radius: 12px; 
            padding: 10px; 
            margin: 15px 0; 
            max-height: 140px; 
            overflow-y: auto; 
            text-align: left; 
            border: 1px solid #1e293b;
        }
        .bet-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1e293b; font-size: 14px; color: #94a3b8; }
        
        input, button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 12px;
            border: none;
            outline: none;
            box-sizing: border-box;
            margin-top: 10px;
            font-weight: bold;
        }
        input { background: #1e293b; color: white; border: 1px solid #475569; text-align: center; }
        .btn-primary { background: #2563eb; color: white; cursor: pointer; text-decoration: none; display: block; text-align: center; }
        .btn-primary:active { background: #1d4ed8; }
        .btn-success { background: #16a34a; color: white; cursor: pointer; }

        /* Оформление карточки бесплатного кейса с обложкой */
        .case-details {
            background: #131b2e;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid #1e293b;
        }
        .case-main-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 16px;
            margin: 0 auto 15px auto;
            display: block;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* Рулетка вращения */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            height: 110px;
            overflow: hidden;
            background: #0b0f19;
            border-radius: 12px;
            border: 2px solid #38bdf8;
            margin: 20px 0;
            display: none;
        }
        .roulette-center-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #facc15;
            z-index: 10;
            transform: translateX(-50%);
        }
        .roulette-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            transition: transform 4s cubic-bezier(0.1, 1, 0.1, 1);
        }
        .roulette-item {
            min-width: 90px;
            height: 90px;
            margin: 0 5px;
            background: #1e293b;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
        }
        .roulette-item img { width: 50px; height: 50px; object-fit: contain; }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #131b2e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1e293b;
        }
        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: auto;
            padding: 0;
            margin: 0;
        }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="logo-font">allDep</div>
        <div class="balance-box">
            ⭐ <span id="userBalance">0</span>
        </div>
    </div>

    <!-- 1. ГЛАВНОЕ МЕНЮ ИГР -->
    <div id="screen-games" class="screen active">
        <div class="main-title">ИГРЫ</div>
        
        <div class="games-grid">
            <div class="game-card" onclick="switchScreen('crash')">
                <div class="game-icon">🚀</div>
                <div class="game-title">Краш</div>
            </div>

            <div class="game-card" onclick="switchScreen('cases-list')">
                <div class="game-icon">🎁</div>
                <div class="game-title">Кейсы</div>
            </div>
        </div>
    </div>

    <!-- 2. СПИСОК КЕЙСОВ -->
    <div id="screen-cases-list" class="screen">
        <button onclick="switchScreen('games')" style="background:none; color:#38bdf8; width:auto; padding:0; margin-bottom:10px; font-size:14px;">← Назад в меню</button>
        <div class="main-title">КЕЙСЫ</div>

        <div class="games-grid">
            <div class="game-card" onclick="switchScreen('free-case-detail')">
                <div class="game-icon">📅</div>
                <div class="game-title">Бесплатный кейс</div>
            </div>
        </div>
    </div>

    <!-- 3. ДЕТАЛИ БЕСПЛАТНОГО КЕЙСА -->
    <div id="screen-free-case-detail" class="screen">
        <button onclick="switchScreen('cases-list')" style="background:none; color:#38bdf8; width:auto; padding:0; margin-bottom:10px; font-size:14px;">← Назад к кейсам</button>
        
        <div class="case-details">
            <!-- Картинка открытого кейса с 3 NFT -->
            <img class="case-main-img" src="https://telegram.org/file/464/2/vX1t76P6kM8.30730/8816f15ef98533b3ca" alt="Бесплатный кейс">

            <div style="font-size: 22px; font-weight: bold; margin-bottom: 8px;">Бесплатный кейс</div>
            <div style="font-size: 14px; color: #94a3b8; margin-bottom: 15px;">
                Подпишись на канал <a href="https://t.me/allDep2" target="_blank" style="color: #38bdf8; text-decoration: underline; font-weight: bold;">https://t.me/allDep2</a>
            </div>

            <!-- Рулетка вращения -->
            <div class="roulette-wrapper" id="rouletteWrapper">
                <div class="roulette-center-line"></div>
                <div class="roulette-track" id="rouletteTrack"></div>
            </div>

            <button class="btn-primary" id="checkSubBtn" onclick="checkSubscription()">Проверить подписку</button>
            <button class="btn-success" id="openCaseBtn" style="display:none;" onclick="startRoulette()">Открыть кейс</button>

            <!-- Результат выигрыша -->
            <div id="winResultBlock" style="display:none; margin-top: 15px;">
                <div style="font-size: 16px; color: #4ade80; font-weight: bold; margin-bottom: 10px;" id="winNftName"></div>
                <button class="btn-primary" onclick="goToInventory()">В инвентарь</button>
            </div>
        </div>
    </div>

    <!-- 4. ИНВЕНТАРЬ -->
    <div id="screen-inventory" class="screen">
        <button onclick="switchScreen('games')" style="background:none; color:#38bdf8; width:auto; padding:0; margin-bottom:10px; font-size:14px;">← Назад в меню</button>
        <div class="main-title">ИНВЕНТАРЬ</div>
        <div id="inventoryItems" style="background: #131b2e; padding: 15px; border-radius: 12px; min-height: 80px; font-size: 14px; color: #94a3b8; border: 1px solid #1e293b;">
            Пока пусто. Откройте бесплатный кейс!
        </div>
    </div>

    <!-- 5. КРАШ -->
    <div id="screen-crash" class="screen crash-screen">
        <button onclick="switchScreen('games')" style="background:none; color:#38bdf8; width:auto; padding:0; margin-bottom:10px; font-size:14px;">← Назад в меню</button>
        
        <div style="font-size: 15px; font-weight: bold; color: #facc15;" id="crashStatus">Ожидание ставки (7с)</div>
        
        <div class="rocket-container">
            <div class="rocket" id="rocketIcon">🚀</div>
            <div class="fire" id="rocketFire" style="display:none;">🔥</div>
            <div class="multiplier" id="crashMultiplier" style="display:none;">1.00x</div>
        </div>

        <div class="bets-list" id="betsList">
            <div class="bet-item"><span>Игроков в раунде:</span> <span>0</span></div>
        </div>

        <div id="betControl">
            <input type="number" id="betInput" min="5" max="10000" value="100" placeholder="Ставка (5 - 10000)">
            <button class="btn-primary" onclick="placeCrashBet()">Сделать ставку</button>
        </div>
        <button id="cashoutBtn" class="btn-success" style="display:none;" onclick="cashOut()">Забрать выигрыш</button>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchScreen('games')">
            <span>🎮</span> Игры
        </button>
        <button class="nav-item" onclick="switchScreen('cases-list')">
            <span>🎁</span> Кейсы
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 0;
        let myBet = 0;
        let inGame = false;
        let hasBetThisRound = false;
        let multiplier = 1.00;
        let crashInterval = null;
        let inventory = [];

        const nftList = [
            { name: "Lucky Locket", img: "https://telegram.org/file/464/2/vX1t76P6kM8.30730/8816f15ef98533b3ca" },
            { name: "Jelly Bunny", img: "https://telegram.org/file/464/3/yG4F10l-jCg.30731/c1bf603a1658b1480f" },
            { name: "Eternal Candle", img: "https://telegram.org/file/464/1/sN6w_6JvGjU.30729/bf8d313ca16e254b03" }
        ];

        const fakeUsers = ["vortex", "crypto_king", "satoshi99", "lucifer", "ton_holder", "max1mb", "twix027"];

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = balance;
        }

        function switchScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                if(s.id === 'screen-' + screenName) s.classList.add('active');
            });
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if(screenName.includes('case')) document.querySelectorAll('.nav-item')[1].classList.add('active');
            else document.querySelectorAll('.nav-item')[0].classList.add('active');
        }

        function checkSubscription() {
            document.getElementById('checkSubBtn').style.display = 'none';
            document.getElementById('openCaseBtn').style.display = 'block';
            alert("Подписка подтверждена! Теперь вы можете открыть кейс.");
        }

        function startRoulette() {
            document.getElementById('openCaseBtn').style.display = 'none';
            const wrapper = document.getElementById('rouletteWrapper');
            const track = document.getElementById('rouletteTrack');
            wrapper.style.display = 'block';

            let itemsHTML = '';
            let itemsArray = [];
            for (let i = 0; i < 30; i++) {
                let randomNft = nftList[Math.floor(Math.random() * nftList.length)];
                itemsArray.push(randomNft);
                itemsHTML += `
                    <div class="roulette-item">
                        <img src="${randomNft.img}" alt="${randomNft.name}">
                        <div style="font-size:10px; color:#fff; margin-top:4px;">${randomNft.name}</div>
                    </div>
                `;
            }
            track.innerHTML = itemsHTML;
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            const winIndex = 23;
            const wonNft = itemsArray[winIndex];

            setTimeout(() => {
                const itemWidth = 100;
                const targetOffset = (winIndex * itemWidth) - (wrapper.offsetWidth / 2) + (itemWidth / 2);
                track.style.transition = 'transform 4s cubic-bezier(0.1, 1, 0.1, 1)';
                track.style.transform = `translateX(-${targetOffset}px)`;
            }, 100);

            setTimeout(() => {
                inventory.push(wonNft);
                document.getElementById('winNftName').innerText = `🎉 Вам выпало: ${wonNft.name}`;
                document.getElementById('winResultBlock').style.display = 'block';
            }, 4500);
        }

        function goToInventory() {
            let invContainer = document.getElementById('inventoryItems');
            let html = '';
            inventory.forEach((item) => {
                html += `
                    <div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #1e293b;">
                        <img src="${item.img}" style="width:35px; height:35px; object-fit:contain;">
                        <span style="color:#fff; font-weight:bold;">${item.name}</span>
                    </div>
                `;
            });
            invContainer.innerHTML = html;
            switchScreen('inventory');
        }

        function initCrashGame() {
            runWaitingPhase();
        }

        function runWaitingPhase() {
            hasBetThisRound = false;
            let countdown = 7;
            document.getElementById('crashStatus').innerText = `Ожидание ставки (${countdown}с)`;
            document.getElementById('crashMultiplier').style.display = 'none';
            document.getElementById('rocketFire').style.display = 'none';
            document.getElementById('rocketIcon').innerText = '🚀';
            document.getElementById('rocketIcon').style.transform = 'translateY(0px)';

            generateOnlineBets();

            let timer = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    document.getElementById('crashStatus').innerText = `Ожидание ставки (${countdown}с)`;
                } else {
                    clearInterval(timer);
                    startFlightPhase();
                }
            }, 1000);
        }

        function generateOnlineBets() {
            let list = document.getElementById('betsList');
            let html = '';
            let count = Math.floor(Math.random() * 4) + 1;
            for(let i=0; i<count; i++) {
                let user = fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
                let amt = Math.floor(Math.random() * 500) + 20;
                html += `<div class="bet-item"><span>${user}</span> <span>⭐ ${amt}</span></div>`;
            }
            if (hasBetThisRound) {
                html += `<div class="bet-item" style="color:#38bdf8; font-weight:bold;"><span>Вы (Ставка)</span> <span>⭐ ${myBet}</span></div>`;
            }
            list.innerHTML = html;
        }

        function placeCrashBet() {
            let amount = parseInt(document.getElementById('betInput').value);
            if (isNaN(amount) || amount < 5 || amount > 10000) {
                alert("Ставка должна быть от 5 до 10000 звезд!");
                return;
            }
            if (balance < amount) {
                alert("Недостаточно звезд на балансе! Ваш баланс: 0 ⭐");
                return;
            }

            balance -= amount;
            myBet = amount;
            hasBetThisRound = true;
            updateBalanceUI();

            document.getElementById('betControl').style.display = 'none';
            generateOnlineBets();
            alert("Ставка принята на следующий раунд!");
        }

        function startFlightPhase() {
            inGame = hasBetThisRound;
            multiplier = 1.00;
            
            document.getElementById('crashStatus').innerText = "🚀 Ракета летит!";
            document.getElementById('crashMultiplier').style.display = 'block';
            document.getElementById('crashMultiplier').innerText = "1.00x";
            document.getElementById('rocketFire').style.display = 'block';

            if (inGame) {
                document.getElementById('cashoutBtn').style.display = 'block';
            }

            let rand = Math.random();
            let crashPoint;
            if (rand < 0.55) {
                crashPoint = 1.35 + Math.random() * (1.87 - 1.35);
            } else if (rand < 0.75) {
                const baseMultipliers = [1.00, 1.02, 1.05, 1.12, 1.18, 1.23, 1.38, 1.49, 1.70, 1.90, 2.00, 2.40, 2.50, 2.70];
                crashPoint = baseMultipliers[Math.floor(Math.random() * baseMultipliers.length)] + (Math.random() * 0.05);
            } else if (rand < 0.92) {
                crashPoint = 3.0 + Math.random() * 7.0;
            } else {
                crashPoint = 10.0 + Math.random() * 90.0;
            }
            crashPoint = parseFloat(crashPoint.toFixed(2));

            let rocketPos = 0;
            crashInterval = setInterval(() => {
                multiplier += 0.04;
                document.getElementById('crashMultiplier').innerText = multiplier.toFixed(2) + 'x';
                rocketPos -= 2;
                if(rocketPos > -40) document.getElementById('rocketIcon').style.transform = `translateY(${rocketPos}px)`;

                if (multiplier >= crashPoint) {
                    clearInterval(crashInterval);
                    explosionPhase(crashPoint);
                }
            }, 100);
        }

        function cashOut() {
            if (!inGame) return;
            inGame = false;
            clearInterval(crashInterval);
            let win = Math.floor(myBet * multiplier);
            balance += win;
            updateBalanceUI();

            document.getElementById('cashoutBtn').style.display = 'none';
            document.getElementById('crashStatus').innerText = `🎉 Вы забрали на ${multiplier.toFixed(2)}x и выиграли ${win} ⭐!`;
            
            setTimeout(runWaitingPhase, 3000);
        }

        function explosionPhase(crashPoint) {
            document.getElementById('rocketFire').style.display = 'none';
            document.getElementById('rocketIcon').innerText = '💥';
            document.getElementById('crashStatus').innerText = `💥 Ракета взорвалась на ${crashPoint.toFixed(2)}x!`;
            document.getElementById('cashoutBtn').style.display = 'none';

            if (inGame) {
                inGame = false;
                document.getElementById('crashStatus').innerText += ` Вы проиграли ${myBet} ⭐`;
            }

            setTimeout(runWaitingPhase, 3500);
        }

        initCrashGame();
    </script>
</body>
</html>
